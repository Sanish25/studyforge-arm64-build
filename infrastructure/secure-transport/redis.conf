# SCRUM-134 Redis broker: plaintext 6379 for host-local clients (published on
# loopback only) and TLS 6380 for OKE. Every client authenticates with a named
# ACL user; the default user is disabled in the ACL file.
bind * -::*
protected-mode yes
port 6379
tls-port 6380
tls-cert-file /run/studyforge-redis/redis.crt
tls-key-file /run/studyforge-redis/redis.key
tls-ca-cert-file /run/studyforge-redis/ca.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
tls-replication no
aclfile /run/studyforge-redis/users.acl
dir /data
# Persistence is unchanged from production: built-in RDB save policy, AOF off.
save 3600 1 300 100 60 10000
appendonly no
